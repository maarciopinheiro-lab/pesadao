[build]
  command = "npm run build"
  publish = "dist"

# PROXY PARA O BACKEND NO RENDER
# Substitua a URL abaixo pela URL real gerada pelo Render (Único local de configuração)
[[redirects]]
  from = "/api/whatsapp/*"
  to = "https://pesadao.onrender.com/api/whatsapp/:splat"
  status = 200
  force = true

# Fallback para o SPA React (deixe sempre por último para evitar erro 404)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
