[build]
  command = "npm run build"
  publish = "dist"

# PROXY PARA O BACKEND NO BACK4APP CONTAINERS
# Substitua a URL abaixo pela URL real gerada pelo Back4app
[[redirects]]
  from = "/api/whatsapp/*"
  to = "https://pesadao2-l0r2n4b7.b4a.run/api/whatsapp/:splat"
  status = 200
  force = true

# Fallback para o SPA React (deixe sempre por último para evitar erro 404)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
